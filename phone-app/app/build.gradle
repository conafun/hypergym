plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
android {
    namespace "com.hypergym"
    compileSdkVersion 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.hypergym"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 7
        versionName "3.1"
    }

    signingConfigs {
        debug {
            storeFile file(keystoreProperties['debug.store.file'])
            storePassword keystoreProperties['debug.store.password']
            keyAlias keystoreProperties['debug.key.alias']
            keyPassword keystoreProperties['debug.key.password']
        }
        release {
            storeFile file(keystoreProperties['release.store.file'])
            storePassword keystoreProperties['release.store.password']
            keyAlias keystoreProperties['release.key.alias']
            keyPassword keystoreProperties['release.key.password']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // 注意：core-ktx 不能超过 1.13.x，否则要求 AGP 8.6+（本项目锁 AGP 8.2.2）
    implementation 'androidx.core:core-ktx:1.13.1'
    // SAF 目录访问（数据落盘到公共文件夹，卸载重装不丢）
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Jetpack Compose（浅色简洁风 UI）
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.10.1'

    // 图表：Vico（与 Compose BOM 2025.05.01 匹配的版本）
    implementation 'com.patrykandpatrick.vico:compose-m3:2.1.4'

    // 视频播放：Media3 ExoPlayer（动作演示循环播放，硬解更流畅）
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}

// Vico 2.1.4 的 compose 模块传递依赖 core-ktx 1.16.0（其 AAR 元数据要求 AGP 8.6+），
// 本项目锁 AGP 8.2.2：强制降到 1.13.1（图表绘制不依赖新版 core 的 API，风险极低）。
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}
